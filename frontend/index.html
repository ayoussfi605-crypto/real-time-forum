<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css">
    <title>Real-time Forum</title>
  </head>
  <body>
    <nav id="navbar" class="hidden">
      <span id="nav-username"></span>
      <button id="logout-btn">➜] Logout</button>
    </nav>

    <div class="page-layout">
      <section id="app"></section>

      <!-- Chat Sidebar -->
      <aside id="chat-sidebar" class="hidden">
      <div class="chat-sidebar-header">
        <h3>💬 Online Users</h3>
      </div>
      <ul id="user-list"></ul>
    </aside>
    </div>

    <div id="chat-window" class="hidden">
      <div class="chat-header">
        <h3 id="chat-user-name">User</h3>
        <button id="close-chat-btn">×</button>
      </div>
      <div id="chat-messages"></div>
      <div id="typing-indicator" class="hidden">
        <span id="typing-user">User</span> is typing<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required maxlength="4096">
        <button type="submit">Send</button>
      </form>
    </div>
  <script type="module" src="/js/initApp.js"></script>

  </body>
</html>
